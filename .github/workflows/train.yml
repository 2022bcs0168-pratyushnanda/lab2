name: Automated Model Training

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run training script
      run: |
        python src/train.py | tee output.txt

    - name: Write Job Summary
      run: |
        echo "## Lab 2 – Automated Training Results" >> $GITHUB_STEP_SUMMARY
        echo "**Name:** Pratyush Nanda" >> $GITHUB_STEP_SUMMARY
        echo "**Roll No:** 2022BCS0168" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Metrics" >> $GITHUB_STEP_SUMMARY
        grep "MSE" output.txt >> $GITHUB_STEP_SUMMARY
        grep "R2_SCORE" output.txt >> $GITHUB_STEP_SUMMARY

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: model-and-metrics
        path: |
          outputs/models/
          outputs/results/

